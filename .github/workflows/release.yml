name: Release

# 打 v* 标签时触发（如 v0.1.0、v0.1.0-alpha.1）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage / deb / rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 固定与本地开发一致的版本：go 1.25.12 在 Windows PE 链接 syso 时
          # cmd/link 会 nil pointer panic（emitRelocations），1.25.10 稳定
          go-version: '1.25.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # go mod tidy 会遍历整个模块树（含 node_modules，其中部分 npm 包自带 .go 文件），
      # 与 npm install 并发时存在目录消失竞态；CI 因此绕开 task 依赖图，
      # 按固定顺序手动执行构建，并给 node_modules 放 go.mod 桩作为额外保险。
      - name: Pre-install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Mark node_modules as Go module boundary
        run: printf 'module node_modules\n' > frontend/node_modules/go.mod

      - name: Install Linux GUI deps (webkitgtk-6.0 + gtk4, Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      # wails3 CLI 本身是 CGO 程序，编译它也需要上面的 GUI 头文件
      - name: Install wails3 CLI (match go.mod)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Build binary (bindings → frontend → go build)
        run: |
          set -euo pipefail
          wails3 generate bindings -f '-tags production -trimpath -buildvcs=false -ldflags="-w -s"' -clean=true -ts
          cd frontend && npm run build && cd ..
          cd build && wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin && cd ..
          mkdir -p build/linux/appimage
          wails3 generate .desktop -name tuxedosql -exec tuxedosql -icon tuxedosql -outputfile build/linux/tuxedosql.desktop -categories 'Development;'
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/tuxedosql

      - name: Package AppImage / deb / rpm
        run: |
          set -euo pipefail
          cd build/linux/appimage
          cp ../../../bin/tuxedosql tuxedosql
          cp ../../appicon.png tuxedosql.png
          wails3 generate appimage -binary tuxedosql -icon tuxedosql.png -desktopfile ../tuxedosql.desktop -outputdir ../../../bin -builddir "$GITHUB_WORKSPACE/build/linux/appimage/build"
          cd "$GITHUB_WORKSPACE"
          wails3 tool package -name tuxedosql -format deb -config ./build/linux/nfpm/nfpm.yaml -out bin
          wails3 tool package -name tuxedosql -format rpm -config ./build/linux/nfpm/nfpm.yaml -out bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm

  build-windows:
    name: Build Windows (exe + NSIS installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 固定与本地开发一致的版本：go 1.25.12 在 Windows PE 链接 syso 时
          # cmd/link 会 nil pointer panic（emitRelocations），1.25.10 稳定
          go-version: '1.25.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pre-install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Mark node_modules as Go module boundary
        run: printf 'module node_modules\n' > frontend/node_modules/go.mod

      - name: Install Linux GUI deps (needed to compile wails3 CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install wails3 CLI (match go.mod)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Install makensis
        run: sudo apt-get install -y nsis

      - name: Cross-compile exe (bindings → frontend → go build)
        run: |
          set -euo pipefail
          wails3 generate bindings -f '-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"' -clean=true -ts
          cd frontend && npm run build && cd ..
          cd build && wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin && cd ..
          # 不生成/链接 syso：Go 链接器在 runner 环境下处理 wails syso 的 PE 重定位
          # 会确定性 panic（cmd/link emitRelocations nil pointer，本地无法复现），
          # 先跳过图标资源内嵌，exe 功能不受影响；NSIS 安装包仍带完整图标。
          go env GOOS GOARCH CGO_ENABLED GOAMD64 GOTOOLCHAIN
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/tuxedosql.exe

      - name: Create NSIS installer
        run: |
          set -euo pipefail
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          makensis -DARG_WAILS_AMD64_BINARY="$GITHUB_WORKSPACE/bin/tuxedosql.exe" build/windows/nsis/project.nsi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            bin/*.exe
            build/windows/nsis/*-installer.exe

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish (or upload to existing draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          # download-artifact 保留原始目录结构（dist/bin/...），只收集文件
          mapfile -t FILES < <(find dist -type f)
          # 手动创建过 draft release（例如用 gh release create --draft）时只补传产物，不重复创建
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "${FILES[@]}" --generate-notes --repo "$REPO"
          fi
