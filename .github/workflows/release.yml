name: Release

# 打 v* 标签时触发（如 v0.1.0、v0.1.0-alpha.1）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage / deb / rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # go mod tidy 会遍历整个模块树（含 node_modules），必须让依赖先装完，
      # 否则与 task 内部的 npm install 并发时会出现目录不存在的竞态
      - name: Pre-install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Linux GUI deps (webkitgtk-6.0 + gtk4, Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      # wails3 CLI 本身是 CGO 程序，编译它也需要上面的 GUI 头文件
      - name: Install wails3 CLI (match go.mod)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Install task runner
        uses: arduino/setup-task@v2

      - name: Build binary
        run: task linux:build

      - name: Package AppImage / deb / rpm
        run: |
          task linux:create:appimage
          task linux:create:deb
          task linux:create:rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm

  build-windows:
    name: Build Windows (exe + NSIS installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # go mod tidy 会遍历整个模块树（含 node_modules），必须让依赖先装完，
      # 否则与 task 内部的 npm install 并发时会出现目录不存在的竞态
      - name: Pre-install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Linux GUI deps (needed to compile wails3 CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install wails3 CLI (match go.mod)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Install makensis
        run: sudo apt-get install -y nsis

      - name: Install task runner
        uses: arduino/setup-task@v2

      - name: Cross-compile exe (CGO disabled)
        run: task windows:build

      - name: Create NSIS installer
        run: task windows:create:nsis:installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            bin/*.exe
            build/windows/nsis/*-installer.exe

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish (or upload to existing draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          # 手动创建过 draft release（例如用 gh release create --draft）时只补传产物，不重复创建
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* --generate-notes --repo "$REPO"
          fi
